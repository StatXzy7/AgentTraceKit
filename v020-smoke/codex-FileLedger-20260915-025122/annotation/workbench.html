r, object]:\n+        return {\"path\": self.path, \"size\": self.size, \"sha256\": self.sha256}\n+\n+\n+@dataclass(frozen=True, slots=True)\n+class Manifest:\n+    files: tuple[FileRecord, ...]\n+\n+    def to_dict(self) -> dict[str, object]:\n+        return {\n+            \"schema_version\": SCHEMA_VERSION,\n+            \"files\": [record.to_dict() for record in self.files],\n+        }\n+\n+\n+def _sha256(path: Path, chunk_size: int = 1024 * 1024) -> str:\n+    digest = hashlib.sha256()\n+    with path.open(\"rb\") as handle:\n+        for chunk in iter(lambda: handle.read(chunk_size), b\"\"):\n+            digest.update(chunk)\n+    return digest.hexdigest()\n+\n+\n+def _portable_relative(path: Path, root: Path) -> str:\n+    return path.relative_to(root).as_posix()\n+\n+\n+def scan_directory(root: Path) -> Manifest:\n+    root = root.resolve()\n+    if not root.exists():\n+        raise FileNotFoundError(f\"input directory does not exist: {root}\")\n+    if not root.is_dir():\n+        raise NotADirectoryError(f\"input path is not a directory: {root}\")\n+\n+    records: list[FileRecord] = []\n+    for path in root.rglob(\"*\"):\n+        if not path.is_file() or path.is_symlink():\n+            continue\n+        records.append(\n+            FileRecord(\n+                path=_portable_relative(path, root),\n+                size=path.stat().st_size,\n+                sha256=_sha256(path),\n+            )\n+        )\n+    records.sort(key=lambda record: record.path)\n+    return Manifest(tuple(records))\n+\n+\n+def write_manifest(manifest: Manifest, destination: Path) -> None:\n+    destination.parent.mkdir(parents=True, exist_ok=True)\n+    text = json.dumps(\n+        manifest.to_dict(),\n+        ensure_ascii=False,\n+        indent=2,\n+        sort_keys=True,\n+    )\n+    destination.write_text(text + \"\\n\", encoding=\"utf-8\", newline=\"\\n\")\n+\n+\n+def load_manifest(path: Path) -> Manifest:\n+    try:\n+        data = json.loads(path.read_text(encoding=\"utf-8\"))\n+    except FileNotFoundError:\n+        raise\n+    except (OSError, json.JSONDecodeError) as exc:\n+        raise ManifestError(f\"cannot read manifest {path}: {exc}\") from exc\n+\n+    if not isinstance(data, dict):\n+        raise ManifestError(\"manifest root must be a JSON object\")\n+    if data.get(\"schema_version\") != SCHEMA_VERSION:\n+        raise ManifestError(f\"unsupported schema_version: {data.get('schema_version')!r}\")\n+    raw_files = data.get(\"files\")\n+    if not isinstance(raw_files, list):\n+        raise ManifestError(\"manifest 'files' must be a list\")\n+\n+    records: list[FileRecord] = []\n+    previous = None\n+    seen: set[str] = set()\n+    for index, item in enumerate(raw_files):\n+        if not isinstance(item, dict):\n+            raise ManifestError(f\"files[{index}] must be an object\")\n+        rel = item.get(\"path\")\n+        size = item.get(\"size\")\n+        sha256 = item.get(\"sha256\")\n+        if not isinstance(rel, str) or not rel or \"\\\\\" in rel or rel.startswith(\"/\"):\n+            raise ManifestError(f\"files[{index}].path is not a portable relative path\")\n+        parts = rel.split(\"/\")\n+        if any(part in {\"\", \".\", \"..\"} for part in parts):\n+            raise ManifestError(f\"files[{index}].path contains invalid path segments\")\n+        if not isinstance(size, int) or isinstance(size, bool) or size < 0:\n+            raise ManifestError(f\"files[{index}].size must be a non-negative integer\")\n+        if not isinstance(sha256, str) or len(sha256) != 64:\n+            raise ManifestError(f\"files[{index}].sha256 must be a 64-character hex string\")\n+        try:\n+            int(sha256, 16)\n+        except ValueError as exc:\n+            raise ManifestError(f\"files[{index}].sha256 must be hexadecimal\") from exc\n+        if rel in seen:\n+            raise ManifestError(f\"duplicate manifest path: {rel}\")\n+        if previous is not None and rel < previous:\n+            raise ManifestError(\"manifest files must be sorted by path\")\n+        seen.add(rel)\n+        previous = rel\n+        records.append(FileRecord(rel, size, sha256.lower()))\n+    return Manifest(tuple(records))\n+\n+\n+def records_by_path(records: Iterable[FileRecord]) -> dict[str, FileRecord]:\n+    return {record.path: record for record in records}\n+\n*** Add File: D:\\myprojects\\FileLedger\\src\\fileledger\\compare.py\n+from __future__ import annotations\n+\n+from dataclasses import dataclass\n+\n+from .manifest import FileRecord, Manifest, records_by_path\n+\n+\n+@dataclass(frozen=True, slots=True)\n+class ChangeSet:\n+    added: tuple[str, ...]\n+    removed: tuple[str, ...]\n+    modified: tuple[str, ...]\n+    unchanged: tuple[str, ...]\n+\n+    @property\n+    def matches(self) -> bool:\n+        return not (self.added or self.removed or self.modified)\n+\n+    def to_dict(self) -> dict[str, object]:\n+        return {\n+            \"added\": list(self.added),\n+            \"removed\": list(self.removed),\n+            \"modified\": list(self.modified),\n+            \"unchanged\": list(self.unchanged),\n+            \"summary\": {\n+                \"added\": len(self.added),\n+                \"removed\": len(self.removed),\n+                \"modified\": len(self.modified),\n+                \"unchanged\": len(self.unchanged),\n+            },\n+        }\n+\n+\n+def compare_manifests(old: Manifest, new: Manifest) -> ChangeSet:\n+    old_map = records_by_path(old.files)\n+    new_map = records_by_path(new.files)\n+\n+    old_paths = set(old_map)\n+    new_paths = set(new_map)\n+    added = tuple(sorted(new_paths - old_paths))\n+    removed = tuple(sorted(old_paths - new_paths))\n+\n+    modified: list[str] = []\n+    unchanged: list[str] = []\n+    for path in sorted(old_paths & new_paths):\n+        before: FileRecord = old_map[path]\n+        after: FileRecord = new_map[path]\n+        if before.size != after.size or before.sh = scan_directory(args.root)\n+            write_manifest(manifest, args.manifest)\n+            _print_json({\"files\": len(manifest.files), \"manifest\": str(args.manifest)})\n+            return EXIT_OK\n+\n+        if args.command == \"diff\":\n+            old = load_manifest(args.old_manifest)\n+            new = load_manifest(args.new_manifest)\n+            changes = compare_manifests(old, new)\n+            _print_json(changes.to_dict())\n+            return EXIT_OK if changes.matches else EXIT_DIFFERENT\n+\n+        if args.command == \"verify\":\n+            expected = load_manifest(args.manifest)\n+            actual = scan_directory(args.root)\n+            changes = compare_manifests(expected, actual)\n+            _print_json(changes.to_dict())\n+            return EXIT_OK if changes.matches else EXIT_DIFFERENT\n+    except (FileNotFoundError, NotADirectoryError, PermissionError, ManifestError, OSError) as exc:\n+        print(f\"fileledger: error: {exc}\", file=sys.stderr)\n+        return EXIT_USAGE_OR_INPUT\n+\n+    parser.error(f\"unknown command: {args.command}\")\n+    return EXIT_USAGE_OR_INPUT\n+\n+\n+if __name__ == \"__main__\":\n+    raise SystemExit(main())\n+\n*** Add File: D:\\myprojects\\FileLedger\\src\\fileledger\\__main__.py\n+from .cli import main\n+\n+raise SystemExit(main())\n+\n*** Add File: D:\\myprojects\\FileLedger\\tests\\test_manifest.py\n+from __future__ import annotations\n+\n+import hashlib\n+import json\n+from pathlib import Path\n+\n+import pytest\n+\n+from fileledger.compare import compare_manifests\n+from fileledger.manifest import ManifestError, load_manifest, scan_directory, write_manifest\n+\n+\n+def test_snapshot_is_sorted_portable_and_deterministic(tmp_path: Path) -> None:\n+    root = tmp_path / \"root\"\n+    (root / \"z\").mkdir(parents=True)\n+    (root / \"z\" / \"b.txt\").write_text(\"beta\", encoding=\"utf-8\")\n+    (root / \"a.txt\").write_text(\"alpha\", encoding=\"utf-8\")\n+\n+    manifest = scan_direc 1` when differences are found.\n+\n*** Add File: D:\\myprojects\\FileLedger\\README.md\n+# FileLedger\n+\n+FileLedger is a small local Python 3.11+ command-line tool for deterministic file inventories.\n+It can snapshot a directory, compare two saved manifests, and verify a current directory against a historical manifest.\n+\n+## Install\n+\n+```powershell\n+python -m pip install -e .\n+```\n+\n+No runtime dependencies beyond the Python standard library are used.\n+\n+## Commands\n+\n+```text\n+fileledger snapshot ROOT MANIFEST\n+fileledger diff OLD_MANIFEST NEW_MANIFEST\n+fileledger verify ROOT MANIFEST\n+```\n+\n+`snapshot` recursively scans regular files beneath `ROOT` and writes a JSON manifest.\n+`diff` compares two manifests and reports added, removed, modified, and unchanged paths.\n+`verify` rescans `ROOT` and compares the result with `MANIFEST`.\n+\n+## Manifest format\n+\n+Manifests are UTF-8 JSON with a stable schema:\n+\n+```json\n+{\n+  \"files\": [\n+    {\n+      \"path\": \"docs/readme.txt\",\n+      \"sha256\": \"...64 hex characters...\",\n+      \"size\": 123\n+    }\n+  ],\n+  \"schema_version\": 1\n+}\n+```\n+\n+Each entry records the path relative to `ROOT`, byte size, and SHA-256 digest. Paths always use `/`, even on Windows. Entries are sorted lexicographically by portable relative path. JSON object keys are also sorted and output uses `\\n` line endings, so an unchanged directory produces byte-for-byte identical manifest output.\n+\n+## Diff / verify output\n+\n+Both commands write JSON to stdout:\n+\n+```json\n+{\n+  \"added\": [\"new.txt\"],\n+  \"modified\": [\"changed.txt\"],\n+  \"removed\": [\"old.txt\"],\n+  \"summary\": {\n+    \"added\": 1,\n+    \"modified\": 1,\n+    \"removed\": 1,\n+    \"unchanged\": 2\n+  },\n+  \"unchanged\": [\"keep.txt\", \"nested/stable.txt\"]\n+}\n+```\n+\n+Errors are written to stderr.\n+\n+## Exit codes\n+\n+- `0`: command completed and, for `diff` / `verify`, no differences were found.\n+- `1`: `diff` / `verify` completed successfully and found one or more differences.\n+- `2`: invalid/unreadable input, malformed manifest, filesystem error, or CLI usage error.\n+\n+## Input scope and limitations\n+\n+- Scans only regular files reachable beneath the supplied root.\n+- Symbolic links are not followed or included.\n+- File metadata other than relative path, size, and SHA-256 is intentionally ignored; permissions, owner, timestamps, ACLs, extended attributes, directories, and empty directories are not represented.\n+- A file changed while it is being hashed can yield a snapshot reflecting the bytes observed during that read. FileLedger does not lock files or provide filesystem-transaction semantics.\n+- Comparison treats a file as modified when its byte size or SHA-256 differs. Renames appear as one removal plus one addition.\n+- Manifest paths are validated as portable relative paths and duplicate or unsorted entries are rejected.\n+\n+## Development\n+\n+```powershell\n+python -m pip install -e . pytest\n+python -m pytest -q\n+```\n+\n+See `examples/README.md` for a minimal workflow.\n*** End Patch", "internal_chat_message_metadata_passthrough": {"turn_id": "01a08fc4-055e-7fd0-a92c-160a69b4cc0b"}, "item_id": "ctc_713dbc0e3c4b43f792e16682e3e2b2d0"}, {"type": "function_call", "id": "fc_b951085e47d0425799197d2ab8de34fa", "name": "exec_command", "arguments": "{\"cmd\":\"python --version; python -m pytest -q\",\"workdir\":\"D:\\\\myprojects\\\\FileLedger\",\"yield_time_ms\":1000,\"max_output_tokens\":20000}", "call_id": "call_L0rC0p2_zwCqRy9ffbddUQ9o7fI5MTrJ", "internal_chat_message_metadata_passthrough": {"turn_id": "01a08fc4-055e-7fd0-a92c-160a69b4cc0b"}, "item_id": "fc_b951085e47d0425799197d2ab8de34fa"}, {"type": "function_call", "id": "fc_765ff2914a434329a784efaccb2d6f5f", "name": "exec_command", "arguments": "{\"cmd\":\"py -3.11 -m venv .venv; .\\\\.venv\\\\Scripts\\\\python.exe -m pip install -e . pytest; .\\\\.venv\\\\Scripts\\\\python.exe -m pytest -q\",\"workdi Error(f\"input directory does not exist: {root}\")\r\n    if not root.is_dir():\r\n        raise NotADirectoryError(f\"input path is not a directory: {root}\")\r\n\r\n    records: list[FileRecord] = []\r\n    for path in root.rglob(\"*\"):\r\n        if not path.is_file() or path.is_symlink():\r\n            continue\r\n        records.append(\r\n            FileRecord(\r\n                path=_portable_relative(path, root),\r\n                size=path.stat().st_size,\r\n                sha256=_sha256(path),\r\n            )\r\n        )\r\n    records.sort(key=lambda record: record.path)\r\n    return Manifest(tuple(records))\r\n\r\n\r\ndef write_manifest(manifest: Manifest, destination: Path) -> None:\r\n    destination.parent.mkdir(parents=True, exist_ok=True)\r\n    text = json.dumps(\r\n        manifest.to_dict(),\r\n        ensure_ascii=False,\r\n        indent=2,\r\n        sort_keys=True,\r\n    )\r\n    destination.write_text(text + \"\\n\", encoding=\"utf-8\", newline=\"\\n\")\r\n\r\n\r\ndef load_manifest(path: Path) -> Manifest:\r\n    try:\r\n        data = json.loads(path.read_text(encoding=\"utf-8\"))\r\n    except FileNotFoundError:\r\n        raise\r\n    except (OSError, json.JSONDecodeError) as exc:\r\n        raise ManifestError(f\"cannot read manifest {path}: {exc}\") from exc\r\n\r\n    if not isinstance(data, dict):\r\n        raise ManifestError(\"manifest root must be a JSON object\")\r\n    if data.get(\"schema_version\") != SCHEMA_VERSION:\r\n        raise ManifestError(f\"unsupported schema_version: {data.get('schema_version')!r}\")\r\n    raw_files = data.get(\"files\")\r\n    if not isinstance(raw_files, list):\r\n        raise ManifestError(\"manifest 'files' must be a list\")\r\n\r\n    records: list[FileRecord] = []\r\n    previous = None\r\n    seen: set[str] = set()\r\n    for index, item in enumerate(raw_files):\r\n        if not isinstance(item, dict):\r\n            raise ManifestError(f\"files[{index}] must be an object\")\r\n        rel = item.get(\"path\")\r\n        size = item.get(\"size\")\r\n        sha256 = item.get(\"sha256\")\r\n        if not isinstance(rel, str) or not rel or \"\\\\\" in rel or rel.startswith(\"/\"):\r\n            raise ManifestError(f\"files[{index}].path is not a portable relative path\")\r\n        parts = rel.split(\"/\")\r\n        if any(part in {\"\", \".\", \"..\"} for part in parts):\r\n            raise ManifestError(f\"files[{index}].path contains invalid path segments\")\r\n        if not isinstance(size, int) or isinstance(size, bool) or size < 0:\r\n            raise ManifestError(f\"files[{index}].size must be a non-negative integer\")\r\n        if not isinstance(sha256, str) or len(sha256) != 64:\r\n            raise ManifestError(f\"files[{index}].sha256 must be a 64-character hex string\")\r\n        try:\r\n            int(sha256, 16)\r\n        except ValueError as exc:\r\n            raise ManifestError(f\"files[{index}].sha256 must be hexadecimal\") from exc\r\n        if rel in seen:\r\n            raise ManifestError(f\"duplicate manifest path: {rel}\")\r\n        if previous is not None and rel < previous:\r\n            raise ManifestError(\"manifest files must be sorted by path\")\r\n        seen.add(rel)\r\n        previous = rel\r\n        records.append(FileRecord(rel, size, sha256.lower()))\r\n    return Manifest(tuple(records))\r\n\r\n\r\ndef records_by_path(records: Iterable[FileRecord]) -> dict[str, FileRecord]:\r\n    return {record.path: record for record in records}\r\n\r\n--- compare.py ---\r\nfrom __future__ import annotations\r\n\r\nfrom dataclasses import dataclass\r\n\r\nfrom .manifest import FileRecord, Manifest, records_by_path\r\n\r\n\r\n@dataclass(frozen=True, slots=True)\r\nclass ChangeSet:\r\n    added: tuple[str, ...]\r\n    removed: tuple[str, ...]\r\n    modified: tuple[str, ...]\r\n    unchanged: tuple[str, ...]\r\n\r\n    @property\r\n    def matches(self) -> bool:\r\n        return not (self.added or self.removed or self.modified)\r\n\r\n    def to_dict(self) -> dict[str, object]:\r\n        return {\r\n            \"added\": list(self.added),\r\n            \"removed\": list(self.removed),\r\n            \"modified\": list(self.modified),\r\n            \"unchanged\": list(self.unchanged),\r\n            \"summary\": {\r\n                \"added\": len(self.added),\r\n                \"removed\": len(self.removed),\r\n                \"modified\": len(self.modified),\r\n                \"unchanged\": len(self.unchanged),\r\n            },\r\n        }\r\n\r\n\r\ndef compare_manifests(old: Manifest, new: Manifest) -> ChangeSet:\r\n    old_map = records_by_path(old.files)\r\n    new_map = records_by_path(new.files)\r\n\r\n    old_paths = set(old_map)\r\n    new_paths = set(new_map)\r\n    added = tuple(sorted(new_paths - old_paths))\r\n    removed = tuple(sorted(old_paths - new_paths))\r\n\r\n    modified: list[str] = []\r\n    unchanged: list[str] = []\r\n    for path in sorted(old_paths & new_paths):\r\n        before: FileRecord = old_map[path]\r\n        after: FileRecord = new_map[path]\r\n        if before.size != after.size or before.sha256 != after.sha256:\r\n            modified.append(path)\r\n        else:\r\n            unchanged.append(path)\r\n\r\n    return ChangeSet(added, removed, tuple(modified), tuple(unchanged))\r\n\r\n--- tests ---\r\nfrom __future__ import annotations\r\n\r\nimport hashlib\r\nimport json\r\nfrom pathlib import Path\r\n\r\nimport pytest\r\n\r\nfrom fileledger.compare import compare_manifests\r\nfrom fileledger.manifest import ManifestError, load_manifest, scan_directory, write_manifest\r\n\r\n\r\ndef test_snapshot_is_sorted_portable_and_deterministic(tmp_path: Path) -> None:\r\n    root = tmp_path / \"root\"\r\n    (root / \"z\").mkdir(parents=True)\r\n    (root / \"z\" / \"b.txt\").write_text(\"beta\", encoding=\"utf-8\")\r\n    (root / \"a.txt\").write_text(\"alpha\", encoding=\"utf-8\")\r\n\r\n    manifest = scan_directory(root)\r\n    assert [record.path for record in manifest.files] == [\"a.txt\", \"z/b.txt\"]\r\n    assert manifest.files[0].size == 5\r\n    assert manifest.files[0].sha256 == hashlib.sha256(b\"alpha\").hexdigest()\r\n\r\n    first = tmp_path / \"first.json\"\r\n    second = tmp_path / \"second.json\"\r\n    write_manifest(manifest, first)\r\n    write_manifest(scan_directory(root), second)\r\n    assert first.read_bytes() == second.read_bytes()\r\n\r\n\r\ndef test_compare_all_change_classes(tmp_path: Path) -> None:\r\n    root = tmp_path / \"root\"\r\n    root.mkdir()\r\n    (root / \"same.txt\").write_text(\"same\", encoding=\"utf-8\")\r\n    (root / \"modify.txt\").write_text(\"old\", encoding=\"utf-8\")\r\n    (root / \"remove.txt\").write_text(\"gone\", encoding=\"utf-8\")\r\n    before = scan_directory(root)\r\n\r\n    (root / \"modify.txt\").write_text(\"new\", encoding=\"utf-8\")\r\n    (root / \"remove.txt\").unlink()\r\n    (root / \"add.txt\").write_text(\"added\", encoding=\"utf-8\")\r\n    after = scan_directory(root)\r\n\r\n    changes = compare_manifests(before, after)\r\n    assert changes.added == (\"add.txt\",)\r\n    assert changes.removed == (\"remove.txt\",)\r\n    assert changes.modified == (\"modify.txt\",)\r\n    assert changes.unchanged == (\"same.txt\",)\r\n\r\n\r\ndef test_load_rejects_unsorted_manifest(tmp_path: Path) -> None:\r\n    path = tmp_path / \"bad.json\"\r\n    path.write_text(\r\n        json.dumps(\r\n            {\r\n                \"schema_version\": 1,\r\n                \"files\": [\r\n                    {\"path\": \"z.txt\", \"size\": 0, \"sha256\": \"0\" * 64},\r\n                    {\"path\": \"a.txt\", \"size\": 0, \"sha256\": \"0\" * 64},\r\n                ],\r\n            }\r\n        ),\r\n        encoding=\"utf-8\",\r\n    )\r\n    with pytest.raises(ManifestError, match=\"sorted\"):\r\n        load_manifest(path)\r\n\r\nfrom __future__ import annotations\r\n\r\nimport json\r\nfrom pathlib import Path\r\n\r\nfrom fileledger.cli import EXIT_DIFFERENT, EXIT_OK, EXIT_USAGE_OR_INPUT, main\r\n\r\n\r\ndef test_snapshot_diff_and_verify(tmp_path: Path, capsys) -> None:\r\n    root = tmp_path / \"root\"\r\n    root.mkdir()\r\n    (root / \"one.txt\").write_text(\"one\", encoding=\"utf-8\")\r\n    before = tmp_path / \"before.json\"\r\n    after = tmp_path / \"after.json\"\r\n\r\n    assert main([\"snapshot\", str(root), str(before)]) == EXIT_OK\r\n    capsys.readouterr()\r\n    assert main([\"verify\", str(root), str(before)]) == EXIT_OK\r\n    verify_clean = json.loads(capsys.readouterr().out)\r\n    assert verify_clean[\"summary\"] == {\"added\": 0, \"modified\": 0, \"removed\": 0, \"unchanged\": 1}\r\n\r\n    (root / \"one.txt\").write_text(\"changed\", encoding=\"utf-8\")\r\n    (root / \"two.txt\").write_text(\"two\", encoding=\"utf-8\")\r\n    assert main([\"snapshot\", str(root), str(after)]) == EXIT_OK\r\n    capsys.readouterr()\r\n\r\n    assert main([\"diff\", str(before), str(after)]) == EXIT_DIFFERENT\r\n    diff = json.loads(capsys.readouterr().out)\r\n    assert diff[\"modified\"] == [\"one.txt\"]\r\n    assert diff[\"added\"] == [\"two.txt\"]\r\n\r\n    assert main([\"verify\", str(root), str(before)]) == EXIT_DIFFERENT\r\n    capsys.readouterr()\r\n\r\n\r\ndef test_input_error_goes_to_stderr(tmp_path: Path, capsys) -> None:\r\n    code = main([\"snapshot\", str(tmp_path / \"missing\"), str(tmp_path / \"out.json\")])\r\n    captured = capsys.readouterr()\r\n    assert code == EXIT_USAGE_OR_INPUT\r\n    assert captured.out == \"\"\r\n    assert captured.err.startswith(\"fileledger: error:\")\r\n\r\n--- README ---\r\n# FileLedger\r\n\r\nFileLedger is a small local Python 3.11+ command-line tool for deterministic file inventories.\r\nIt can snapshot a directory, compare two saved manifests, and verify a current directory against a historical manifest.\r\n\r\n## Install\r\n\r\n```powershell\r\npython -m pip install -e .\r\n```\r\n\r\nNo runtime dependencies beyond the Python standard library are used.\r\n\r\n## Commands\r\n\r\n```text\r\nfileledger snapshot ROOT MANIFEST\r\nfileledger diff OLD_MANIFEST NEW_MANIFEST\r\nfileledger verify ROOT MANIFEST\r\n```\r\n\r\n`snapshot` recursively scans regular files beneath `ROOT` and writes a JSON manifest.\r\n`diff` compares two manifests and reports added, removed, modified, and unchanged paths.\r\n`verify` rescans `ROOT` and compares the result with `MANIFEST`.\r\n\r\n## Manifest format\r\n\r\nManifests are UTF-8 JSON with a stable schema:\r\n\r\n```json\r\n{\r\n  \"files\": [\r\n    {\r\n      \"path\": \"docs/readme.txt\",\r\n      \"sha256\": \"...64 hex characters...\",\r\n      \"size\": 123\r\n    }\r\n  ],\r\n  \"schema_version\": 1\r\n}\r\n```\r\n\r\nEach entry records the path relative to `ROOT`, byte size, and SHA-256 digest. Paths always use `/`, even on Windows. Entries are sorted lexicographically by portable relative path. JSON object keys are also sorted and output uses `\\n` line endings, so an unchanged directory produces byte-for-byte identical manifest output.\r\n\r\n## Diff / verify output\r\n\r\nBoth commands write JSON to stdout:\r\n\r\n```json\r\n{\r\n  \"added\": [\"new.txt\"],\r\n  \"modified\": [\"changed.txt\"],\r\n  \"removed\": [\"old.txt\"],\r\n  \"summary\": {\r\n    \"added\": 1,\r\n    \"modified\": 1,\r\n    \"removed\": 1,\r\n    \"unchanged\": 2\r\n  },\r\n  \"unchanged\": [\"keep.txt\", \"nested/stable.txt\"]\r\n}\r\n```\r\n\r\nErrors are written to stderr.\r\n\r\n## Exit codes\r\n\r\n- `0`: command completed and, for `diff` / `verify`, no differences were found.\r\n- `1`: `diff` / `verify` completed successfully and found one or more differences.\r\n- `2`: invalid/unreadable input, malformed manifest, filesystem error, or CLI usage error.\r\n\r\n## Input scope and limitations\r\n\r\n- Scans only regular files reachable beneath the supplied root.\r\n- Symbolic links are not followed or included.\r\n- File metadata other than relative path, size, and SHA-256 is intentionally ignored; permissions, owner, timestamps, ACLs, extended attributes, directories, and empty directories are not represented.\r\n- A file changed while it is being hashed can yield a snapshot reflecting the bytes observed during that read. FileLedger does not lock files or provide filesystem-transaction semantics.\r\n- Comparison treats a file as modified when its byte size or SHA-256 differs. Renames appear as one removal plus one addition.\r\n- Manifest paths are validated as portable relative paths and duplicate or unsorted entries are rejected.\r\n\r\n## Development\r\n\r\n```powershell\r\npython -m pip install -e . pytest\r\npython -m pytest -q\r\n```\r\n\r\nSee `examples/README.md` for a minimal workflow.\r\n", "internal_chat_message_metadata_passthrough": {"turn_id": "01a08fc9-5eb1-7903-acb1-e095a64dce93", "create_time": 1789118756.5069084}, "item_id": "fco_01a08fc9-b69a-7442-aa66-4c316244a71c"}, {"type": "custom_tool_call_output", "id": "ctco_01a08fca-807e-75f2-a320-2a59966d90c7", "call_id": "call_qQBTkHeHU0LJWHUbql4QbxCzTM_lMGcv", "output": "Exit code: 0\nWall time: 0 seconds\nOutput:\nSuccess. Updated the following files:\nM D:\\myprojects\\FileLedger\\src\\fileledger\\manifest.py\nM D:\\myprojects\\FileLedger\\src\\fileledger\\compare.py\nM D:\\myprojects\\FileLedger\\src\\fileledger\\cli.py\nM D:\\myprojects\\FileLedger\\tests\\test_manifest.py\nM D:\\myprojects\\FileLedger\\tests\\test_cli.py\nM D:\\myprojects\\FileLedger\\README.md\nM D:\\myprojects\\FileLedger\\examples\\README.md\n", "internal_chat_message_metadata_passthrough": {"turn_id": "01a08fc9-5eb1-7903-acb1-e095a64dce93", "create_time": 1789118808.1900537}, "item_id": "ctco_01a08fca-807e-75f2-a320-2a59966d90c7"}, {"type": "function_call_output", "id": "fco_01a08fca-9abe-7821-84b7-e6aba5622063", "call_id": "call_UxzQUtN_imiW_TDqKZxVwtacxN4IQiiz", "output": "Chunk ID: 9f7662\nWall time: 1.9320 seconds\nProcess exited with code 0\nOriginal token count: 28\nOutput:\n............ end(\r\n                        FileRecord(\r\n                            path=relative,\r\n                            size=entry_stat.st_size,\r\n                            sha256=_sha256(path),\r\n                        )\r\n                    )\r\n\r\n    walk(root)\r\n    records.sort(key=lambda record: record.path)\r\n    return Manifest(tuple(records))\r\n\r\n\r\ndef write_manifest(manifest: Manifest, destination: Path) -> None:\r\n    parent = destination.parent\r\n    if not parent.exists():\r\n        raise FileNotFoundError(f\"output parent directory does not exist: {parent}\")\r\n    if not parent.is_dir():\r\n        raise NotADirectoryError(f\"output parent path is not a directory: {parent}\")\r\n    text = json.dumps(\r\n        manifest.to_dict(),\r\n        ensure_ascii=False,\r\n        indent=2,\r\n        sort_keys=True,\r\n    )\r\n    created = False\r\n    try:\r\n        with destination.open(\"x\", encoding=\"utf-8\", newline=\"\\n\") as handle:\r\n            created = True\r\n            handle.write(text + \"\\n\")\r\n    except Exception:\r\n        if created:\r\n            try:\r\n                destination.unlink()\r\n            except FileNotFoundError:\r\n                pass\r\n        raise\r\n\r\n\r\ndef load_manifest(path: Path) -> Manifest:\r\n    try:\r\n        data = json.loads(path.read_text(encoding=\"utf-8\"))\r\n    except FileNotFoundError:\r\n        raise\r\n    except (OSError, json.JSONDecodeError) as exc:\r\n        raise ManifestError(f\"cannot read manifest {path}: {exc}\") from exc\r\n\r\n    if not isinstance(data, dict):\r\n        raise ManifestError(\"manifest root must be a JSON object\")\r\n    if data.get(\"schema_version\") != SCHEMA_VERSION:\r\n        raise ManifestError(f\"unsupported schema_version: {data.get('schema_version')!r}\")\r\n    raw_files = data.get(\"files\")\r\n    if not isinstance(raw_files, list):\r\n        raise ManifestError(\"manifest 'files' must be a list\")\r\n\r\n    records: list[FileRecord] = []\r\n    previous = None\r\n    seen: set[str] = set()\r\n    for index, item in enumerate(raw_files):\r\n        if not isinstance(item, dict):\r\n            raise ManifestError(f\"files[{index}] must be an object\")\r\n        rel = item.get(\"path\")\r\n        size = item.get(\"size\")\r\n        sha256 = item.get(\"sha256\")\r\n        if not isinstance(rel, str) or not rel or \"\\\\\" in rel or rel.startswith(\"/\"):\r\n            raise ManifestError(f\"files[{index}].path is not a portable relative path\")\r\n        parts = rel.split(\"/\")\r\n        if any(part in {\"\", \".\", \"..\"} for part in parts):\r\n            raise ManifestError(f\"files[{index}].path contains invalid path segments\")\r\n        if not isinstance(size, int) or isinstance(size, bool) or size < 0:\r\n            raise ManifestError(f\"files[{index}].size must be a non-negative integer\")\r\n        if not isinstance(sha256, str) or len(sha256) != 64:\r\n            raise ManifestError(f\"files[{index}].sha256 must be a 64-character hex string\")\r\n        try:\r\n            int(sha256, 16)\r\n        except ValueError as exc:\r\n            raise ManifestError(f\"files[{index}].sha256 must be hexadecimal\") from exc\r\n        if rel in seen:\r\n            raise ManifestError(f\"duplicate manifest path: {rel}\")\r\n        if previous is not None and rel < previous:\r\n            raise ManifestError(\"manifest files must be sorted by path\")\r\n        seen.add(rel)\r\n        previous = rel\r\n        records.append(FileRecord(rel, size, sha256.lower()))\r\n    return Manifest(tuple(records))\r\n\r\n\r\ndef records_by_path(records: Iterable[FileRecord]) -> dict[str, FileRecord]:\r\n    return {record.path: record for record in records}\r\nfrom __future__ import annotations\r\n\r\nimport argparse\r\nimport json\r\nimport sys\r\nfrom pathlib import Path\r\n\r\nfrom .compare import compare_manifests\r\nfrom .manifest import ManifestError, load_manifest, normalize_exclude, scan_directory, write_manifest\r\n\r\nEXIT_OK = 0\r\nEXIT_DIFFERENT = 1\r\nEXIT_USAGE_OR_INPUT = 2\r\n\r\n\r\ndef _parser() -> argparse.ArgumentParser:\r\n    parser = argparse.ArgumentParser(\r\n        prog=\"fileledger\",\r\n        description=\"Create deterministic file manifests, compare them, and verify directories.\",\r\n    )\r\n    subparsers = parser.add_subparsers(dest=\"command\", required=True)\r\n\r\n    snapshot = subparsers.add_parser(\"snapshot\", help=\"scan a directory and write a manifest\")\r\n    snapshot.add_argument(\"root\", type=Path, help=\"directory to scan recursively\")\r\n    snapshot.add_argument(\"manifest\", type=Path, help=\"output JSON manifest path\")\r\n    snapshot.add_argument(\"--exclude\", action=\"append\", default=[], metavar=\"RELATIVE_PATH\")\r\n\r\n    diff = subparsers.add_parser(\"diff\", help=\"compare two manifest files\")\r\n    diff.add_argument(\"old_manifest\", type=Path)\r\n    diff.add_argument(\"new_manifest\", type=Path)\r\n    diff.add_argument(\"--format\", choices=(\"json\", \"text\"), default=\"json\")\r\n\r\n    verify = subparsers.add_parser(\"verify\", help=\"compare a directory with a historical manifest\")\r\n    verify.add_argument(\"root\", type=Path, help=\"directory to scan recursively\")\r\n    verify.add_argument(\"manifest\", type=Path, help=\"expected JSON manifest\")\r\n    verify.add_argument(\"--exclude\", action=\"append\", default=[], metavar=\"RELATIVE_PATH\")\r\n    verify.add_argument(\"--format\", choices=(\"json\", \"text\"), default=\"json\")\r\n\r\n    return parser\r\n\r\n\r\ndef _print_json(value: object) -> None:\r\n    json.dump(value, sys.stdout, ensure_ascii=False, indent=2, sort_keys=True)\r\n    sys.stdout.write(\"\\n\")\r\n\r\n\r\ndef _print_changes(changes, output_format: str) -> None:\r\n    if output_format == \"json\":\r\n        _print_json(changes.to_dict())\r\n    else:\r\n        sys.stdout.write(changes.to_text())\r\n\r\n\r\ndef main(argv: list[str] | None = None) -> int:\r\n    parser = _parser()\r\n    args = parser.parse_args(argv)\r\n    try:\r\n        if args.command == \"snapshot\":\r\n            excludes = [normalize_exclude(value) for value in args.exclude]\r\n            manifest = scan_directory(args.root, excludes)\r\n            write_manifest(manifest, args.manifest)\r\n            _print_json({\"files\": len(manifest.files), \"manifest\": str(args.manifest)})\r\n            return EXIT_OK\r\n\r\n        if args.command == \"diff\":\r\n            old = load_manifest(args.old_manifest)\r\n            new = load_manifest(args.new_manifest)\r\n            changes = compare_manifests(old, new)\r\n            _print_changes(changes, args.format)\r\n            return EXIT_OK if changes.matches else EXIT_DIFFERENT\r\n\r\n        if args.command == \"verify\":\r\n            excludes = [normalize_exclude(value) for value in args.exclude]\r\n            expected = load_manifest(args.manifest)\r\n            actual = scan_directory(args.root, excludes)\r\n            changes = compare_manifests(expected, actual)\r\n            _print_changes(changes, args.format)\r\n            return EXIT_OK if changes.matches else EXIT_DIFFERENT\r\n    except (FileNotFoundError, NotADirectoryError, PermissionError, ManifestError, OSError) as exc:\r\n        print(f\"fileledger: error: {exc}\", file=sys.stderr)\r\n        return EXIT_USAGE_OR_INPUT\r\n\r\n    parser.error(f\"unknown command: {args.command}\")\r\n    return EXIT_USAGE_OR_INPUT\r\n\r\n\r\nif __name__ == \"__main__\":\r\n    raise SystemExit(main())\r\nfrom __future__ import annotations\r\n\r\nfrom dataclasses import dataclass\r\n\r\nfrom .manifest import FileRecord, Manifest, records_by_path\r\n\r\n\r\n@dataclass(frozen=True, slots=True)\r\nclass ChangeSet:\r\n    added: tuple[str, ...]\r\n    removed: tuple[str, ...]\r\n    modified: tuple[str, ...]\r\n    unchanged: tuple[str, ...]\r\n\r\n    @property\r\n    def matches(self) -> bool:\r\n        return not (self.added or self.removed or self.modified)\r\n\r\n    def to_dict(self) -> dict[str, object]:\r\n        return {\r\n            \"added\": list(self.added),\r\n            \"removed\": list(self.removed),\r\n            \"modified\": list(self.modified),\r\n            \"unchanged\": list(self.unchanged),\r\n            \"summary\": {\r\n                \"added\": len(self.added),\r\n                \"removed\": len(self.removed),\r\n                \"modified\": len(self.modified),\r\n                \"unchanged\": len(self.unchanged),\r\n            },\r\n        }\r\n\r\n    def to_text(self) -> str:\r\n        sections = (\r\n            (\"added\", self.added),\r\n            (\"removed\", self.removed),\r\n            (\"modified\", self.modified),\r\n            (\"unchanged\", self.unchanged),\r\n        )\r\n        lines: list[str] = []\r\n        for name, paths in sections:\r\n            lines.append(f\"{name} ({len(paths)}):\")\r\n            lines.extend(f\"  {path}\" for path in paths)\r\n        return \"\\n\".join(lines) + \"\\n\"\r\n\r\n\r\ndef compare_manifests(old: Manifest, new: Manifest) -> ChangeSet:\r\n    old_map = records_by_path(old.files)\r\n    new_map = records_by_path(new.files)\r\n\r\n    old_paths = set(old_map)\r\n    new_paths = set(new_map)\r\n    added = tuple(sorted(new_paths - old_paths))\r\n    removed = tuple(sorted(old_paths - new_paths))\r\n\r\n    modified: list[str] = []\r\n    unchanged: list[str] = []\r\n    for path in sorted(old_paths & new_paths):\r\n        before: FileRecord = old_map[path]\r\n        after: FileRecord = new_map[path]\r\n        if before.size != after.size or before.sha256 != after.sha256:\r\n            modified.append(path)\r\n        else:\r\n            unchanged.append(path)\r\n\r\n    return ChangeSet(added, removed, tuple(modified), tuple(unchanged))\r\nfrom __future__ import annotations\r\n\r\nimport hashlib\r\nimport json\r\nfrom pathlib import Path\r\n\r\nimport pytest\r\n\r\nfrom fileledger.compare import compare_manifests\r\nfrom fileledger.manifest import ManifestError, load_manifest, normalize_exclude, scan_directory, write_manifest\r\n\r\n\r\ndef test_snapshot_is_sorted_portable_and_deterministic(tmp_path: Path) -> None:\r\n    root = tmp_path / \"root\"\r\n    (root / \"z\").mkdir(parents=True)\r\n    (root / \"z\" / \"b.txt\").write_text(\"beta\", encoding=\"utf-8\")\r\n    (root / \"a.txt\").write_text(\"alpha\", encoding=\"utf-8\")\r\n\r\n    manifest = scan_directory(root)\r\n    assert [record.path for record in manifest.files] == [\"a.txt\", \"z/b.txt\"]\r\n    assert manifest.files[0].size == 5\r\n    assert manifest.files[0].sha256 == hashlib.sha256(b\"alpha\").hexdigest()\r\n\r\n    first = tmp_path / \"first.json\"\r\n    second = tmp_path / \"second.json\"\r\n    write_manifest(manifest, first)\r\n    write_manifest(scan_directory(root), second)\r\n    assert first.read_bytes() == second.read_bytes()\r\n\r\n\r\ndef test_compare_all_change_classes(tmp_path: Path) -> None:\r\n    root = tmp_path / \"root\"\r\n    root.mkdir()\r\n    (root / \"same.txt\").write_text(\"same\", encoding=\"utf-8\")\r\n    (root / \"modify.txt\").write_text(\"old\", encoding=\"utf-8\")\r\n    (root / \"remove.txt\").write_text(\"gone\", encoding=\"utf-8\")\r\n    before = scan_directory(root)\r\n\r\n    (root / \"modify.txt\").write_text(\"new\", encoding=\"utf-8\")\r\n    (root / \"remove.txt\").unlink()\r\n    (root / \"add.txt\").write_text(\"added\", encoding=\"utf-8\")\r\n    after = scan_directory(root)\r\n\r\n    changes = compare_manifests(before, after)\r\n    assert changes.added == (\"add.txt\",)\r\n    assert changes.removed == (\"remove.txt\",)\r\n    assert changes.modified == (\"modify.txt\",)\r\n    assert changes.unchanged == (\"same.txt\",)\r\n\r\n\r\ndef test_load_rejects_unsorted_manifest(tmp_path: Path) -> None:\r\n    path = tmp_path / \"bad.json\"\r\n    path.write_text(\r\n        json.dumps(\r\n            {\r\n                \"schema_version\": 1,\r\n                \"files\": [\r\n                    {\"path\": \"z.txt\", \"size\": 0, \"sha256\": \"0\" * 64},\r\n                    {\"path\": \"a.txt\", \"size\": 0, \"sha256\": \"0\" * 64},\r\n                ],\r\n            }\r\n        ),\r\n        encoding=\"utf-8\",\r\n    )\r\n    with pytest.raises(ManifestError, match=\"sorted\"):\r\n        load_manifest(path)\r\n\r\n\r\ndef test_exclude_file_and_subtree_and_validation(tmp_path: Path) -> None:\r\n    root = tmp_path / \"root\"\r\n    (root / \"cache\" / \"nested\").mkdir(parents=True)\r\n    (root / \"keep.txt\").write_text(\"keep\", encoding=\"utf-8\")\r\n    (root / \"skip.txt\").write_text(\"skip\", encoding=\"utf-8\")\r\n    (root / \"cache\" / \"nested\" / \"x.bin\").write_bytes(b\"\\x00\\xff\")\r\n\r\n    manifest = scan_directory(root, [\"skip.txt\", \"cache\"])\r\n    assert [record.path for record in manifest.files] == [\"keep.txt\"]\r\n\r\n    for invalid in [\"\", \".\", \"..\", \"a/../b\", \"/absolute\", \"C:\\\\absolute\"]:\r\n        with pytest.raises(ManifestError):\r\n            normalize_exclude(invalid)\r\n\r\n\r\ndef test_unicode_binary_and_empty_directory(tmp_path: Path) -> None:\r\n    root = tmp_path / \"根\"\r\n    (root / \"空目录\").mkdir(parents=True)\r\n    (root / \"子目录\").mkdir()\r\n    (root / \"子目录\" / \"你好.bin\").write_bytes(bytes(range(256)))\r\n\r\n    manifest = scan_directory(root)\r\n    assert [record.path for record in manifest.files] == [\"子目录/你好.bin\"]\r\n    assert manifest.files[0].size == 256\r\n    assert manifest.files[0].sha256 == hashlib.sha256(bytes(range(256))).hexdigest()\r\n\r\n\r\ndef test_write_requires_existing_parent_and_refuses_overwrite(tmp_path: Path) -> None:\r\n    root = tmp_path / \"root\"\r\n    root.mkdir()\r\n    manifest = scan_directory(root)\r\n\r\n    with pytest.raises(FileNotFoundError, match=\"parent\"):\r\n        write_manifest(manifest, tmp_path / \"missing\" / \"out.json\")\r\n\r\n    destination = tmp_path / \"out.json\"\r\n    destination.write_text(\"sentinel\", encoding=\"utf-8\")\r\n    with pytest.raises(FileExistsError):\r\n        write_manifest(manifest, destination)\r\n    assert destination.read_text(encoding=\"utf-8\") == \"sentinel\"\r\n\r\n\r\ndef test_write_cleans_partial_file_on_failure(tmp_path: Path, monkeypatch) -> None:\r\n    root = tmp_path / \"root\"\r\n    root.mkdir()\r\n    manifest = scan_directory(root)\r\n    destination = tmp_path / \"partial.json\"\r\n    original_open = Path.open\r\n\r\n    class FailingWriter:\r\n        def __init__(self, handle):\r\n            self.handle = handle\r\n\r\n        def __enter__(self):\r\n            self.handle.__enter__()\r\n            return self\r\n\r\n        def write(self, text: str) -> int:\r\n            self.handle.write(text[:5])\r\n            self.handle.flush()\r\n            raise OSError(\"simulated write failure\")\r\n\r\n        def __exit__(self, exc_type, exc, tb):\r\n            return self.handle.__exit__(exc_type, exc, tb)\r\n\r\n    def failing_open(path: Path, *args, **kwargs):\r\n        handle = original_open(path, *args, **kwargs)\r\n        if path == destination:\r\n            return FailingWriter(handle)\r\n        return handle\r\n\r\n    monkeypatch.setattr(Path, \"open\", failing_open)\r\n    with pytest.raises(OSError, match=\"simulated write failure\"):\r\n        write_manifest(manifest, destination)\r\n    assert not destination.exists()\r\n\r\n\r\ndef test_symlink_is_rejected_when_supported(tmp_path: Path) -> None:\r\n    root = tmp_path / \"root\"\r\n    root.mkdir()\r\n    target = root / \"target.txt\"\r\n    target.write_text(\"x\", encoding=\"utf-8\")\r\n    link = root / \"link.txt\"\r\n    try:\r\n        link.symlink_to(target)\r\n    except (OSError, NotImplementedError):\r\n        pytest.skip(\"symlinks are not available in this environment\")\r\n    with pytest.raises(ManifestError, match=\"special filesystem entry\"):\r\n        scan_directory(root)\r\nfrom __future__ import annotations\r\n\r\nimport json\r\nfrom pathlib import Path\r\n\r\nfrom fileledger.cli import EXIT_DIFFERENT, EXIT_OK, EXIT_USAGE_OR_INPUT, main\r\n\r\n\r\ndef test_snapshot_diff_and_verify(tmp_path: Path, capsys) -> None:\r\n    root = tmp_path / \"root\"\r\n    root.mkdir()\r\n    (root / \"one.txt\").write_text(\"one\", encoding=\"utf-8\")\r\n    before = tmp_path / \"before.json\"\r\n    after = tmp_path / \"after.json\"\r\n\r\n    assert main([\"snapshot\", str(root), str(before)]) == EXIT_OK\r\n    capsys.readouterr()\r\n    assert main([\"verify\", str(root), str(before)]) == EXIT_OK\r\n    verify_clean = json.loads(capsys.readouterr().out)\r\n    assert verify_clean[\"summary\"] == {\"added\": 0, \"modified\": 0, \"removed\": 0, \"unchanged\": 1}\r\n\r\n    (root / \"one.txt\").write_text(\"changed\", encoding=\"utf-8\")\r\n    (root / \"two.txt\").write_text(\"two\", encoding=\"utf-8\")\r\n    assert main([\"snapshot\", str(root), str(after)]) == EXIT_OK\r\n    capsys.readouterr()\r\n\r\n    assert main([\"diff\", str(before), str(after)]) == EXIT_DIFFERENT\r\n    diff = json.loads(capsys.readouterr().out)\r\n    assert diff[\"modified\"] == [\"one.txt\"]\r\n    assert diff[\"added\"] == [\"two.txt\"]\r\n\r\n    assert main([\"verify\", str(root), str(before)]) == EXIT_DIFFERENT\r\n    capsys.readouterr()\r\n\r\n\r\ndef test_input_error_goes_to_stderr(tmp_path: Path, capsys) -> None:\r\n    code = main([\"snapshot\", str(tmp_path / \"missing\"), str(tmp_path / \"out.json\")])\r\n    captured = capsys.readouterr()\r\n    assert code == EXIT_USAGE_OR_INPUT\r\n    assert captured.out == \"\"\r\n    assert captured.err.startswith(\"fileledger: error:\")\r\n\r\n\r\ndef test_snapshot_and_verify_share_exclude_semantics(tmp_path: Path, capsys) -> None:\r\n    root = tmp_path / \"root\"\r\n    root.mkdir()\r\n    (root / \"keep.txt\").write_text(\"keep\", encoding=\"utf-8\")\r\n    (root / \"ignored.txt\").write_text(\"v1\", encoding=\"utf-8\")\r\n    manifest = tmp_path / \"manifest.json\"\r\n\r\n    assert main([\"snapshot\", str(root), str(manifest), \"--exclude\", \"ignored.txt\"]) == EXIT_OK\r\n    capsys.readouterr()\r\n    (root / \"ignored.txt\").write_text(\"v2\", encoding=\"utf-8\")\r\n    assert main([\"verify\", str(root), str(manifest), \"--exclude\", \"ignored.txt\"]) == EXIT_OK\r\n    result = json.loads(capsys.readouterr().out)\r\n    assert result[\"summary\"][\"unchanged\"] == 1\r\n\r\n\r\ndef test_text_format_is_sorted_and_preserves_exit_code(tmp_path: Path, capsys) -> None:\r\n    root = tmp_path / \"root\"\r\n    root.mkdir()\r\n    (root / \"z.txt\").write_text(\"old\", encoding=\"utf-8\")\r\n    before = tmp_path / \"before.json\"\r\n    after = tmp_path / \"after.json\"\r\n    assert main([\"snapshot\", str(root), str(before)]) == EXIT_OK\r\n    capsys.readouterr()\r\n    (root / \"z.txt\").write_text(\"new\", encoding=\"utf-8\")\r\n    (root / \"a.txt\").write_text(\"add\", encoding=\"utf-8\")\r\n    assert main([\"snapshot\", str(root), str(after)]) == EXIT_OK\r\n    capsys.readouterr()\r\n\r\n    assert main([\"diff\", str(before), str(after), \"--format\", \"text\"]) == EXIT_DIFFERENT\r\n    output = capsys.readouterr().out\r\n    assert output == (\r\n        \"added (1):\\n  a.txt\\n\"\r\n        \"removed (0):\\n\"\r\n        \"modified (1):\\n  z.txt\\n\"\r\n        \"unchanged (0):\\n\"\r\n    )\r\n\r\n\r\ndef test_cli_rejects_invalid_exclude_and_existing_output(tmp_path: Path, capsys) -> None:\r\n    root = tmp_path / \"root\"\r\n    root.mkdir()\r\n    output = tmp_path / \"out.json\"\r\n\r\n    assert main([\"snapshot\", str(root), str(output), \"--exclude\", \"../outside\"]) == EXIT_USAGE_OR_INPUT\r\n    captured = capsys.readouterr()\r\n    assert captured.out == \"\"\r\n    assert \"exclude\" in captured.err\r\n\r\n    output.write_text(\"existing\", encoding=\"utf-8\")\r\n    assert main([\"snapshot\", str(root), str(output)]) == EXIT_USAGE_OR_INPUT\r\n    captured = capsys.readouterr()\r\n    assert captured.out == \"\"\r\n    assert output.read_text(encoding=\"utf-8\") == \"existing\"\r\n\r\n\r\ndef test_verify_text_clean_exit_code(tmp_path: Path, capsys) -> None:\r\n    root = tmp_path / \"root\"\r\n    root.mkdir()\r\n    (root / \"x.txt\").write_text(\"x\", encoding=\"utf-8\")\r\n    manifest = tmp_path / \"manifest.json\"\r\n    assert main([\"snapshot\", str(root), str(manifest)]) == EXIT_OK\r\n    capsys.readouterr()\r\n    assert main([\"verify\", str(root), str(manifest), \"--format\", \"text\"]) == EXIT_OK\r\n    assert \"unchanged (1):\\n  x.txt\\n\" in capsys.readouterr().out\r\n# FileLedger\r\n\r\nFileLedger is a small local Python 3.11+ command-line tool for deterministic file inventories.\r\nIt can snapshot a directory, compare two saved manifests, and verify a current directory against a historical manifest.\r\n\r\n## Install\r\n\r\n```powershell\r\npython -m pip install -e .\r\n```\r\n\r\nNo runtime dependencies beyond the Python standard library are used.\r\n\r\n## Commands\r\n\r\n```text\r\nfileledger snapshot ROOT MANIFEST [--exclude RELATIVE_PATH ...]\r\nfileledger diff OLD_MANIFEST NEW_MANIFEST [--format json|text]\r\nfileledger verify ROOT MANIFEST [--exclude RELATIVE_PATH ...] [--format json|text]\r\n```\r\n\r\n`snapshot` recursively scans regular files beneath `ROOT` and writes a JSON manifest.\r\n`diff` compares two manifests and reports added, removed, modified, and unchanged paths.\r\n`verify` rescans `ROOT` and compares the result with `MANIFEST`.\r\n\r\n`--exclude` may be repeated. Each value names a relative file or directory subtree and uses the same semantics in `snapshot` and `verify`. Absolute paths, empty paths, `.`, `..`, and paths containing `.` / `..` segments are rejected. Backslashes are normalized to `/` after absolute-path validation.\r\n\r\n## Manifest format\r\n\r\nManifests are UTF-8 JSON with a stable schema:\r\n\r\n```json\r\n{\r\n  \"files\": [\r\n    {\r\n      \"path\": \"docs/readme.txt\",\r\n      \"sha256\": \"...64 hex characters...\",\r\n      \"size\": 123\r\n    }\r\n  ],\r\n  \"schema_version\": 1\r\n}\r\n```\r\n\r\nEach entry records the path relative to `ROOT`, byte size, and SHA-256 digest. Paths always use `/`, even on Windows. Entries are sorted lexicographically by portable relative path. JSON object keys are also sorted and output uses `\\n` line endings, so an unchanged directory produces byte-for-byte identical manifest output.\r\n\r\n## Diff / verify output\r\n\r\nBoth commands write JSON to stdout by default, preserving the original output format:\r\n\r\n```json\r\n{\r\n  \"added\": [\"new.txt\"],\r\n  \"modified\": [\"changed.txt\"],\r\n  \"removed\": [\"old.txt\"],\r\n  \"summary\": {\r\n    \"added\": 1,\r\n    \"modified\": 1,\r\n    \"removed\": 1,\r\n    \"unchanged\": 2\r\n  },\r\n  \"unchanged\": [\"keep.txt\", \"nested/stable.txt\"]\r\n}\r\n```\r\n\r\nUse `--format text` for a human-readable form. Every category includes its count and sorted paths, for example:\r\n\r\n```text\r\nadded (1):\r\n  new.txt\r\nremoved (0):\r\nmodified (1):\r\n  changed.txt\r\nunchanged (1):\r\n  keep.txt\r\n```\r\n\r\nErrors are written to stderr.\r\n\r\n## Exit codes\r\n\r\n- `0`: command completed and, for `diff` / `verify`, no differences were found.\r\n- `1`: `diff` / `verify` completed successfully and found one or more differences.\r\n- `2`: invalid/unreadable input, malformed manifest, filesystem error, or CLI usage error.\r\n\r\n## Input scope and limitations\r\n\r\n- Scans ordinary directories recursively and records ordinary files only.\r\n- Symbolic links, Windows junctions/reparse points, FIFOs, sockets, devices, and other special filesystem entries are rejected with an error. They are never followed or silently skipped.\r\n- Excluded directory subtrees are pruned before inspecting entries inside them.\r\n- File metadata other than relative path, size, and SHA-256 is intentionally ignored; permissions, owner, timestamps, ACLs, extended attributes, directories, and empty directories are not represented.\r\n- The snapshot destination's parent directory must already exist. FileLedger never overwrites an existing manifest. The destination is created only after scanning succeeds; if writing fails after creation, FileLedger attempts to remove the partial output.\r\n- A file changed while it is being hashed can yield a snapshot reflecting the bytes observed during that read. FileLedger does not lock files or provide filesystem-transaction semantics.\r\n- Comparison treats a file as modified when its byte size or SHA-256 differs. Renames appear as one removal plus one addition.\r\n- Manifest paths are validated as portable relative paths and duplicate or unsorted entries are rejected.\r\n\r\n## Development\r\n\r\n```powershell\r\npython -m pip install -e . pytest\r\npython -m pytest -q\r\n```\r\n\r\nSee `examples/README.md` for a minimal workflow.\r\n", "internal_chat_message_metadata_passthrough": {"turn_id": "01a08fd0-36b4-7041-82d6-4771cee95620", "create_time": 1789119204.427055}, "item_id": "fco_01a08fd0-8c4b-7032-bccc-ddeddf756c9f"}, {"type": "custom_tool_call_output", "id": "ctco_01a08fd0-e2d4-7393-94aa-c9c1f6f44366", "call_id": "call_s_ZSmFNrbRVAE9UPAe4JjpbrxYMVs1dB", "output": "Exit code: 0\nWall time: 0 seconds\nOutput:\nSuccess. Updated the following files:\nA D:\\myprojects\\FileLedger\\.gitignore\nM D:\\myprojects\\FileLedger\\tests\\test_manifest.py\n", "internal_chat_message_metadata_passthrough": {"turn_id": "01a08fd0-36b4-7041-82d6-4771cee95620", "create_time": 1789119226.580521}, "item_id": "ctco_01a08fd0-e2d4-7393-94aa-c9c1f6f44366"}, {"type": "function_call_output", "id": "fco_01a08fd0-f946-7430-9c6c-051ed4410e72", "call_id": "call_wTutXV1KhgmLB-gNvrVO2XZKmaNwZkX8", "output": "Chunk ID: 4d5147\nWall time: 1.1984 seconds\nProcess exited with code 0\nOriginal token count: 28\nOutput:\n.............s. dified\"] == [\"one.txt\"]\r\n    assert diff[\"added\"] == [\"two.txt\"]\r\n\r\n    assert main([\"verify\", str(root), str(before)]) == EXIT_DIFFERENT\r\n    capsys.readouterr()\r\n\r\n\r\ndef test_input_error_goes_to_stderr(tmp_path: Path, capsys) -> None:\r\n    code = main([\"snapshot\", str(tmp_path / \"missing\"), str(tmp_path / \"out.json\")])\r\n    captured = capsys.readouterr()\r\n    assert code == EXIT_USAGE_OR_INPUT\r\n    assert captured.out == \"\"\r\n    assert captured.err.startswith(\"fileledger: error:\")\r\n\r\n\r\ndef test_snapshot_and_verify_share_exclude_semantics(tmp_path: Path, capsys) -> None:\r\n    root = tmp_path / \"root\"\r\n    root.mkdir()\r\n    (root / \"keep.txt\").write_text(\"keep\", encoding=\"utf-8\")\r\n    (root / \"ignored.txt\").write_text(\"v1\", encoding=\"utf-8\")\r\n    (root / \"ignored-too.txt\").write_text(\"v1\", encoding=\"utf-8\")\r\n    manifest = tmp_path / \"manifest.json\"\r\n\r\n    excludes = [\"--exclude\", \"ignored.txt\", \"--exclude\", \"ignored-too.txt\"]\r\n    assert main([\"snapshot\", str(root), str(manifest), *excludes]) == EXIT_OK\r\n    capsys.readouterr()\r\n    (root / \"ignored.txt\").write_text(\"v2\", encoding=\"utf-8\")\r\n    (root / \"ignored-too.txt\").write_text(\"v2\", encoding=\"utf-8\")\r\n    assert main([\"verify\", str(root), str(manifest), *excludes]) == EXIT_OK\r\n    result = json.loads(capsys.readouterr().out)\r\n    assert result[\"summary\"][\"unchanged\"] == 1\r\n\r\n\r\ndef test_snapshot_does_not_create_output_when_scan_fails(tmp_path: Path, capsys) -> None:\r\n    missing_root = tmp_path / \"missing\"\r\n    destination = tmp_path / \"manifest.json\"\r\n\r\n    assert main([\"snapshot\", str(missing_root), str(destination)]) == EXIT_USAGE_OR_INPUT\r\n    capsys.readouterr()\r\n    assert not destination.exists()\r\n\r\n\r\ndef test_text_format_is_sorted_and_preserves_exit_code(tmp_path: Path, capsys) -> None:\r\n    root = tmp_path / \"root\"\r\n    root.mkdir()\r\n    (root / \"z.txt\").write_text(\"old\", encoding=\"utf-8\")\r\n    before = tmp_path / \"before.json\"\r\n    after = tmp_path / \"after.json\"\r\n    assert main([\"snapshot\", str(root), str(before)]) == EXIT_OK\r\n    capsys.readouterr()\r\n    (root / \"z.txt\").write_text(\"new\", encoding=\"utf-8\")\r\n    (root / \"a.txt\").write_text(\"add\", encoding=\"utf-8\")\r\n    assert main([\"snapshot\", str(root), str(after)]) == EXIT_OK\r\n    capsys.readouterr()\r\n\r\n    assert main([\"diff\", str(before), str(after), \"--format\", \"text\"]) == EXIT_DIFFERENT\r\n    output = capsys.readouterr().out\r\n    assert output == (\r\n        \"added (1):\\n  a.txt\\n\"\r\n        \"removed (0):\\n\"\r\n        \"modified (1):\\n  z.txt\\n\"\r\n        \"unchanged (0):\\n\"\r\n    )\r\n\r\n\r\ndef test_cli_rejects_invalid_exclude_and_existing_output(tmp_path: Path, capsys) -> None:\r\n    root = tmp_path / \"root\"\r\n    root.mkdir()\r\n    output = tmp_path / \"out.json\"\r\n\r\n    assert main([\"snapshot\", str(root), str(output), \"--exclude\", \"../outside\"]) == EXIT_USAGE_OR_INPUT\r\n    captured = capsys.readouterr()\r\n    assert captured.out == \"\"\r\n    assert \"exclude\" in captured.err\r\n\r\n    output.write_text(\"existing\", encoding=\"utf-8\")\r\n    assert main([\"snapshot\", str(root), str(output)]) == EXIT_USAGE_OR_INPUT\r\n    captured = capsys.readouterr()\r\n    assert captured.out == \"\"\r\n    assert output.read_text(encoding=\"utf-8\") == \"existing\"\r\n\r\n\r\ndef test_verify_text_clean_exit_code(tmp_path: Path, capsys) -> None:\r\n    root = tmp_path / \"root\"\r\n    root.mkdir()\r\n    (root / \"x.txt\").write_text(\"x\", encoding=\"utf-8\")\r\n    manifest = tmp_path / \"manifest.json\"\r\n    assert main([\"snapshot\", str(root), str(manifest)]) == EXIT_OK\r\n    capsys.readouterr()\r\n    assert main([\"verify\", str(root), str(manifest), \"--format\", \"text\"]) == EXIT_OK\r\n    assert \"unchanged (1):\\n  x.txt\\n\" in capsys.readouterr().out\r\n--- tests manifest ---\r\nfrom __future__ import annotations\r\n\r\nimport hashlib\r\nimport json\r\nimport os\r\nimport subprocess\r\nfrom pathlib import Path\r\n\r\nimport pytest\r\n\r\nfrom fileledger.compare import compare_manifests\r\nfrom fileledger.manifest import ManifestError, load_manifest, normalize_exclude, scan_directory, write_manifest\r\n\r\n\r\ndef test_snapshot_is_sorted_portable_and_deterministic(tmp_path: Path) -> None:\r\n    root = tmp_path / \"root\"\r\n    (root / \"z\").mkdir(parents=True)\r\n    (root / \"z\" / \"b.txt\").write_text(\"beta\", encoding=\"utf-8\")\r\n    (root / \"a.txt\").write_text(\"alpha\", encoding=\"utf-8\")\r\n\r\n    manifest = scan_directory(root)\r\n    assert [record.path for record in manifest.files] == [\"a.txt\", \"z/b.txt\"]\r\n    assert manifest.files[0].size == 5\r\n    assert manifest.files[0].sha256 == hashlib.sha256(b\"alpha\").hexdigest()\r\n\r\n    first = tmp_path / \"first.json\"\r\n    second = tmp_path / \"second.json\"\r\n    write_manifest(manifest, first)\r\n    write_manifest(scan_directory(root), second)\r\n    assert first.read_bytes() == second.read_bytes()\r\n\r\n\r\ndef test_compare_all_change_classes(tmp_path: Path) -> None:\r\n    root = tmp_path / \"root\"\r\n    root.mkdir()\r\n    (root / \"same.txt\").write_text(\"same\", encoding=\"utf-8\")\r\n    (root / \"modify.txt\").write_text(\"old\", encoding=\"utf-8\")\r\n    (root / \"remove.txt\").write_text(\"gone\", encoding=\"utf-8\")\r\n    before = scan_directory(root)\r\n\r\n    (root / \"modify.txt\").write_text(\"new\", encoding=\"utf-8\")\r\n    (root / \"remove.txt\").unlink()\r\n    (root / \"add.txt\").write_text(\"added\", encoding=\"utf-8\")\r\n    after = scan_directory(root)\r\n\r\n    changes = compare_manifests(before, after)\r\n    assert changes.added == (\"add.txt\",)\r\n    assert changes.removed == (\"remove.txt\",)\r\n    assert changes.modified == (\"modify.txt\",)\r\n    assert changes.unchanged == (\"same.txt\",)\r\n\r\n\r\ndef test_load_rejects_unsorted_manifest(tmp_path: Path) -> None:\r\n    path = tmp_path / \"bad.json\"\r\n    path.write_text(\r\n        json.dumps(\r\n            {\r\n                \"schema_version\": 1,\r\n                \"files\": [\r\n                    {\"path\": \"z.txt\", \"size\": 0, \"sha256\": \"0\" * 64},\r\n                    {\"path\": \"a.txt\", \"size\": 0, \"sha256\": \"0\" * 64},\r\n                ],\r\n            }\r\n        ),\r\n        encoding=\"utf-8\",\r\n    )\r\n    with pytest.raises(ManifestError, match=\"sorted\"):\r\n        load_manifest(path)\r\n\r\n\r\ndef test_exclude_file_and_subtree_and_validation(tmp_path: Path) -> None:\r\n    root = tmp_path / \"root\"\r\n    (root / \"cache\" / \"nested\").mkdir(parents=True)\r\n    (root / \"keep.txt\").write_text(\"keep\", encoding=\"utf-8\")\r\n    (root / \"skip.txt\").write_text(\"skip\", encoding=\"utf-8\")\r\n    (root / \"cache\" / \"nested\" / \"x.bin\").write_bytes(b\"\\x00\\xff\")\r\n\r\n    manifest = scan_directory(root, [\"skip.txt\", \"cache\"])\r\n    assert [record.path for record in manifest.files] == [\"keep.txt\"]\r\n\r\n    for invalid in [\"\", \".\", \"..\", \"a/../b\", \"/absolute\", \"C:\\\\absolute\"]:\r\n        with pytest.raises(ManifestError):\r\n            normalize_exclude(invalid)\r\n\r\n\r\ndef test_unicode_binary_and_empty_directory(tmp_path: Path) -> None:\r\n    root = tmp_path / \"根\"\r\n    (root / \"空目录\").mkdir(parents=True)\r\n    (root / \"子目录\").mkdir()\r\n    (root / \"子目录\" / \"你好.bin\").write_bytes(bytes(range(256)))\r\n\r\n    manifest = scan_directory(root)\r\n    assert [record.path for record in manifest.files] == [\"子目录/你好.bin\"]\r\n    assert manifest.files[0].size == 256\r\n    assert manifest.files[0].sha256 == hashlib.sha256(bytes(range(256))).hexdigest()\r\n\r\n\r\ndef test_write_requires_existing_parent_and_refuses_overwrite(tmp_path: Path) -> None:\r\n    root = tmp_path / \"root\"\r\n    root.mkdir()\r\n    manifest = scan_directory(root)\r\n\r\n    with pytest.raises(FileNotFoundError, match=\"parent\"):\r\n        write_manifest(manifest, tmp_path / \"missing\" / \"out.json\")\r\n\r\n    destination = tmp_path / \"out.json\"\r\n    destination.write_text(\"sentinel\", encoding=\"utf-8\")\r\n    with pytest.raises(FileExistsError):\r\n        write_manifest(manifest, destination)\r\n    assert destination.read_text(encoding=\"utf-8\") == \"sentinel\"\r\n\r\n\r\ndef test_write_cleans_partial_file_on_failure(tmp_path: Path, monkeypatch) -> None:\r\n    root = tmp_path / \"root\"\r\n    root.mkdir()\r\n    manifest = scan_directory(root)\r\n    destination = tmp_path / \"partial.json\"\r\n    original_open = Path.open\r\n\r\n    class FailingWriter:\r\n        def __init__(self, handle):\r\n            self.handle = handle\r\n\r\n        def __enter__(self):\r\n            self.handle.__enter__()\r\n            return self\r\n\r\n        def write(self, text: str) -> int:\r\n            self.handle.write(text[:5])\r\n            self.handle.flush()\r\n            raise OSError(\"simulated write failure\")\r\n\r\n        def __exit__(self, exc_type, exc, tb):\r\n            return self.handle.__exit__(exc_type, exc, tb)\r\n\r\n    def failing_open(path: Path, *args, **kwargs):\r\n        handle = original_open(path, *args, **kwargs)\r\n        if path == destination:\r\n            return FailingWriter(handle)\r\n        return handle\r\n\r\n    monkeypatch.setattr(Path, \"open\", failing_open)\r\n    with pytest.raises(OSError, match=\"simulated write failure\"):\r\n        write_manifest(manifest, destination)\r\n    assert not destination.exists()\r\n\r\n\r\ndef test_symlink_is_rejected_when_supported(tmp_path: Path) -> None:\r\n    root = tmp_path / \"root\"\r\n    root.mkdir()\r\n    target = root / \"target.txt\"\r\n    target.write_text(\"x\", encoding=\"utf-8\")\r\n    link = root / \"link.txt\"\r\n    try:\r\n        link.symlink_to(target)\r\n    exce 法性、size、SHA-256、重复路径和排序顺序，因此 `expected` 不是未经检查的原始 JSON，而是已经验证过的 `Manifest`。\n\n接下来：\n\nPython\n\n```\nactual = scan_directory(args.root, excludes)\n```\n\n进入 manifest.py 的 `scan_directory()`。\n\n它使用 `os.scandir()` 递归目录，每个目录项先：\n\nPython\n\n```\nentry.stat(follow_symlinks=False)\n_reject_special(...)\n```\n\n所以 symlink、junction/reparse point 和其他特殊文件会在排除判断之前被拒绝。\n\n普通文件最终转换为：\n\nPython\n\n```\nFileRecord(\n    path=relative,\n    size=entry_stat.st_size,\n    sha256=_sha256(path),\n)\n```\n\n记录排序以后形成另一个 `Manifest`，也就是当前文件系统状态 `actual`。\n\n然后 cli.py 调用：\n\nPython\n\n```\nchanges = compare_manifests(expected, actual)\n```\n\n实现位于 compare.py 的 `compare_manifests()`。\n\n两个 manifest 先通过 records\\_by\\_path() 变成：\n\nPython\n\n```\nold_map = {\n    \"a.txt\": FileRecord(...),\n    ...\n}\n\nnew_map = {\n    \"a.txt\": FileRecord(...),\n    ...\n}\n```\n\n然后取路径集合：\n\nPython\n\n```\nold_paths = set(old_map)\nnew_paths = set(new_map)\n```\n\n四种结果的计算非常直接：\n\nPython\n\n```\nadded = new_paths - old_paths\nremoved = old_paths - new_paths\n```\n\n因此：\n\n- `added`：当前目录存在，历史 manifest 不存在。\n- `removed`：历史 manifest 存在，当前目录不存在。\n\n对于两边都有的路径：\n\nPython\n\n```\nfor path in sorted(old_paths & new_paths):\n```\n\n比较 `size` 和 `sha256`：\n\nPython\n\n```\nif before.size != after.size or before.sha256 != after.sha256:\n    modified.append(path)\nelse:\n    unchanged.append(path)\n```\n\n所以：\n\n- `modified`：路径相同，但 size 或 SHA-256 任一个变化。\n- `unchanged`：路径、size 和 SHA-256 均一致。\n\n最终返回 ChangeSet：\n\nPython\n\n```\nChangeSet(\n    added=(...),\n    removed=(...),\n    modified=(...),\n    unchanged=(...),\n)\n```\n\n`ChangeSet.matches` 只有在 `added`、`removed`、`modified` 全为空时才为 `True`。\n\n最后 cli.py 的 `_print_changes()` 根据 `--format` 输出：\n\nPython\n\n```\nchanges.to_dict()\n```\n\n或者：\n\nPython\n\n```\nchanges.to_text()\n```\n\nJSON 默认格式中的 `summary` 也是由 ChangeSet.to\\_dict() 根据四个 tuple 的长度即时生成的。\n\n退出码在 cli.py：\n\nPython\n\n```\nreturn EXIT_OK if changes.matches else EXIT_DIFFERENT\n```\n\n即：\n\n```\n0 = 当
